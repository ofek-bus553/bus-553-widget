name: Build bus widget v15
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Build and sign
        env:
          KS_B64: ${{ secrets.BUS553_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.BUS553_KEYSTORE_PASSWORD }}
        run: |
          set -e
          unzip -q 1-bus553-v15-source.zip
          curl -fsSL -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          mkdir -p sdk/cmdline-tools; unzip -q tools.zip -d tmp; mv tmp/cmdline-tools sdk/cmdline-tools/latest
          yes | sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root="$PWD/sdk" --licenses >/dev/null 2>&1 || true
          sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root="$PWD/sdk" 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
          P="$PWD/bus553-v15"; B="$P/build"; BT="$PWD/sdk/build-tools/35.0.0"; mkdir -p "$B/gen" "$B/classes" "$B/dex"
          "$BT/aapt2" compile --dir "$P/res" -o "$B/res.zip"
          "$BT/aapt2" link -o "$B/unsigned.apk" -I "$PWD/sdk/platforms/android-35/android.jar" --manifest "$P/AndroidManifest.xml" "$B/res.zip" --java "$B/gen" --min-sdk-version 23 --target-sdk-version 35 --version-code 15 --version-name 15.0
          javac -encoding UTF-8 -source 8 -target 8 -Xlint:-options -classpath "$PWD/sdk/platforms/android-35/android.jar" -d "$B/classes" $(find "$P/src" "$B/gen" -name '*.java')
          "$BT/d8" --min-api 23 --lib "$PWD/sdk/platforms/android-35/android.jar" --output "$B/dex" $(find "$B/classes" -name '*.class')
          (cd "$B/dex" && zip -q -u "$B/unsigned.apk" classes.dex)
          "$BT/zipalign" -f -p 4 "$B/unsigned.apk" "$B/aligned.apk"
          echo "$KS_B64" | base64 -d > release.jks
          "$BT/apksigner" sign --ks release.jks --ks-key-alias bus553 --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" --out ofek-bus-553-widget.apk "$B/aligned.apk"
          "$BT/apksigner" verify --verbose --print-certs ofek-bus-553-widget.apk | tee apksigner-v15.txt
          grep -q '1c9397b10baeb76af2fb07ebc2d0535ead87a4ee043a194b8eebfa77721eebb3' apksigner-v15.txt
          "$BT/aapt2" dump badging ofek-bus-553-widget.apk | tee aapt-v15.txt
          grep -q "package: name='com.ofek.bus553' versionCode='15'" aapt-v15.txt
          "$BT/aapt2" dump xmltree ofek-bus-553-widget.apk --file AndroidManifest.xml | tee manifest-v15.txt
          grep -q 'LiveTransitService' manifest-v15.txt
          grep -q 'FOREGROUND_SERVICE_SPECIAL_USE' manifest-v15.txt
          grep -q 'PROPERTY_SPECIAL_USE_FGS_SUBTYPE' manifest-v15.txt
          git config user.name github-actions; git config user.email github-actions@github.com
          git add ofek-bus-553-widget.apk apksigner-v15.txt aapt-v15.txt manifest-v15.txt
          git commit -m 'Publish signed bus widget v15 with live notification' && git push
